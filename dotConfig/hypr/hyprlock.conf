general {
    no_fade_in = true
    disable_loading_bar = true
    grace = 0
}

background {
    monitor =
    color = rgba(17, 11, 13, 1)
    blur_passes = 0
    contrast = 1
    brightness = 1
    vibrancy = 0
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 420, 69
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(17, 11, 13, 1)
    font_color = rgba(246, 213, 106, 1)
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text =
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
